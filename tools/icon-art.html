<body style="margin:0;background:#2a2a2a"><script>
const q=new URLSearchParams(location.search),pick=q.get('i'),gray=q.get('gray');
const bg='<defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b2d"/><stop offset="1" stop-color="#121213"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#b)"/>';
// The app's icon: a cassette in white neon outline in front of a warm
// setting sun, over a neon grid floor running to the horizon.
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const H=716; // the horizon
const stars=[...Array(34)].map(()=>{const x=rnd()*1024,y=rnd()*380,r=1.5+rnd()*rnd()*4;return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="#fff" opacity="${(.3+rnd()*.6).toFixed(2)}"/>`}).join('');
const slats=[[500,8],[556,12],[606,16],[652,20],[694,24]].map(([y,h])=>`<rect x="0" y="${y}" width="1024" height="${h}" fill="#000"/>`).join('');
// Grid: lines fanning out from the vanishing point, and rows that widen
// toward the viewer
const fan=[...Array(15)].map((_,i)=>`<line x1="512" y1="${H}" x2="${512+(i-7)*230}" y2="1024"/>`).join('');
const rows=[0,.05,.12,.22,.36,.56,.82].map(t=>`<line x1="0" y1="${(H+t*(1024-H)).toFixed(0)}" x2="1024" y2="${(H+t*(1024-H)).toFixed(0)}"/>`).join('');
const ring=(d,w)=>`<rect x="${132+d}" y="${292+d}" width="${760-2*d}" height="${440-2*d}" rx="${64-d*.7}" fill="none" stroke="#fff" stroke-width="${w}"/>`;
const reel=x=>[90,56].map(r=>`<circle cx="${x}" cy="560" r="${r}" fill="none" stroke="#fff" stroke-width="13"/>`).join('')+[...Array(6)].map((_,i)=>`<line x1="${x}" y1="${560-56}" x2="${x}" y2="${560-34}" stroke="#fff" stroke-width="13" stroke-linecap="round" transform="rotate(${i*60} ${x} 560)"/>`).join('');
const sky=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12063a"/><stop offset=".45" stop-color="#3a0f73"/><stop offset=".7" stop-color="#b3247f"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe45c"/><stop offset=".45" stop-color="#ff9a3d"/><stop offset=".85" stop-color="#ff3da6"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0a52"/><stop offset="1" stop-color="#0d0428"/></linearGradient>
<mask id="sl"><rect width="1024" height="${H}" fill="#fff"/>${slats}</mask>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter></defs>
<rect width="1024" height="1024" fill="url(#sky)"/>${stars}
<circle cx="512" cy="470" r="330" fill="#ff5fa8" opacity=".45" filter="url(#halo)"/>
<circle cx="512" cy="470" r="330" fill="url(#sun)" mask="url(#sl)"/>
<rect y="${H}" width="1024" height="${1024-H}" fill="url(#floor)"/>
<g stroke="#39e6ff" stroke-width="5" opacity=".9">${fan}${rows}</g>
<line x1="0" y1="${H}" x2="1024" y2="${H}" stroke="#ff7ad9" stroke-width="8"/>`;
const tape=`<g transform="translate(512 432) scale(.86) translate(-512 -512)">${ring(0,15)}${ring(30,11)}<rect x="250" y="352" width="524" height="70" rx="10" fill="none" stroke="#fff" stroke-width="11"/>${reel(360)}${reel(664)}</g>`;
const A=sky+`<g filter="url(#glow)" opacity=".8">${tape.replaceAll('#fff','#ff3da6')}</g>`+tape;
const B=bg+`<g fill="none" stroke="#f2efe8" stroke-width="44"><circle cx="352" cy="512" r="150"/><circle cx="672" cy="512" r="150"/></g>
<circle cx="352" cy="512" r="46" fill="#f57a21"/><circle cx="672" cy="512" r="46" fill="#f2efe8"/>`;
const teeth=[...Array(6)].map((_,i)=>`<rect x="488" y="330" width="48" height="96" rx="10" fill="#f2efe8" transform="rotate(${i*60} 512 512)"/>`).join('');
const C=bg+`<circle cx="512" cy="512" r="300" fill="#f2efe8"/><circle cx="512" cy="512" r="190" fill="#161617"/>${teeth}<circle cx="512" cy="512" r="40" fill="#f57a21"/>`;
const svg=(c,s)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="${s}" height="${s}" style="display:block;${gray?'filter:grayscale(1)':''}">${c}</svg>`;
const all={A,B,C};
document.body.innerHTML=pick?svg(all[pick],1024):`<div style="display:flex;gap:40px;padding:40px;font:700 28px -apple-system,Arial;color:#fff">${Object.keys(all).map(k=>`<div style="text-align:center"><div style="border-radius:22.5%;overflow:hidden;width:300px;height:300px">${svg(all[k],300)}</div><div style="margin-top:14px">${k}</div></div>`).join('')}</div>`;
</script></body>
