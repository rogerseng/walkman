<!doctype html>
<!-- Source artwork for the clear cassette. Rendered to PNG by tools/render-art.js.
     ?layer=front  everything on the front of the clear shell: edges, ribs, stickers,
                   label strip, rollers, screws and reflections (the plastic itself is see-through)
     ?layer=hub    one clear reel hub -->
<html><body style="margin:0;background:transparent"><script>
const layer = new URLSearchParams(location.search).get('layer') || 'front';
const screw = (x, y, a) => `
  <g transform="translate(${x} ${y})">
    <circle r="1.75" fill="#fff" fill-opacity=".35" stroke="#7b838b" stroke-opacity=".5" stroke-width=".12"/>
    <circle r="1.2" fill="url(#blackmetal)"/>
    <g transform="rotate(${a})" stroke="#000" stroke-width=".3" stroke-linecap="round"><line x1="-.7" x2=".7"/><line y1="-.7" y2=".7"/></g>
    <path d="M-.85 -.55A1.1 1.1 0 0 1 .3 -1" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".12" stroke-linecap="round"/>
  </g>`;
// a moulded ridge: bright top edge with a faint shadow under it
const ridge = (y, x1 = 1.6, x2 = 98.4) => `
  <line x1="${x1}" x2="${x2}" y1="${y}" y2="${y}" stroke="#fff" stroke-opacity=".9" stroke-width=".3"/>
  <line x1="${x1}" x2="${x2}" y1="${y + .34}" y2="${y + .34}" stroke="#3f474f" stroke-opacity=".30" stroke-width=".14"/>`;
const roller = (x, y) => `
  <circle cx="${x}" cy="${y}" r="3.2" fill="#fff" fill-opacity=".55" stroke="#78808a" stroke-opacity=".55" stroke-width=".16"/>
  <circle cx="${x}" cy="${y}" r="2.5" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width=".22"/>
  <circle cx="${x}" cy="${y}" r="1.5" fill="#fff" fill-opacity=".65" stroke="#78808a" stroke-opacity=".5" stroke-width=".13"/>
  <circle cx="${x}" cy="${y}" r=".5" fill="#aab1b8"/>`;
const ring = (x, y, r) => `
  <circle cx="${x}" cy="${y}" r="${r}" fill="#fff" fill-opacity=".22" stroke="#78808a" stroke-opacity=".45" stroke-width=".14"/>
  <circle cx="${x}" cy="${y}" r="${r - .45}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width=".2"/>`;
const front = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 63" width="1500" height="945">
<defs>
  <radialGradient id="blackmetal" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#5a5c60"/><stop offset=".5" stop-color="#1b1c1e"/><stop offset="1" stop-color="#050505"/></radialGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="sticker" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2183a"/><stop offset="1" stop-color="#99102a"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfaf5"/><stop offset="1" stop-color="#ebe8de"/></linearGradient>
  <filter id="fibre" x="-3%" y="-10%" width="106%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="1.4 2.6" numOctaves="3" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .25  .28 .28 .28 0 -.38" result="fleck"/>
    <feComposite in="fleck" in2="SourceAlpha" operator="in" result="f"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation=".25" result="b"/><feOffset in="b" dy=".2" result="o"/>
    <feComponentTransfer in="o" result="sh"><feFuncA type="linear" slope=".4"/></feComponentTransfer>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/><feMergeNode in="f"/></feMerge>
  </filter>
  <filter id="blur"><feGaussianBlur stdDeviation=".5"/></filter>
  <clipPath id="body"><rect width="100" height="63" rx="2.6"/></clipPath>
</defs>

<!-- stickers sit on the inner sheet, behind the ridges -->
<g font-family="Georgia, 'Times New Roman', serif" fill="#f6e9ec">
  <rect x="6" y="23.6" width="12.4" height="10" fill="url(#sticker)"/>
  <text x="12.2" y="31.3" text-anchor="middle" font-size="7.2">90</text>
  <rect x="81.4" y="23.2" width="12.4" height="12.6" fill="url(#sticker)"/>
  <text x="87.6" y="27.9" text-anchor="middle" font-size="4.4" font-weight="700">I</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="1.75" text-anchor="middle">
    <text x="87.6" y="30.6">POSITION</text><text x="87.6" y="32.7">NORMAL</text><text x="87.6" y="34.8">TYPE I</text></g>
</g>
<!-- footage marks between the hubs -->
<g stroke="#30363c" stroke-opacity=".5" stroke-width=".16">
  ${[44, 46.5, 49, 51.5, 54, 56.5].map(x => `<line x1="${x}" x2="${x}" y1="25.5" y2="31.5"/>`).join('')}</g>

<!-- the plastic: a faint milky wall, bright edges -->
<g clip-path="url(#body)">
  <path fill-rule="evenodd" fill="#fff" fill-opacity=".30" d="M0 0H100V63H0ZM1.5 1.5V61.5H98.5V1.5Z"/>
  <rect x="1.6" y="21.5" width="96.8" height="14.2" fill="#fff" fill-opacity=".07"/>
  ${ridge(15.4)}${ridge(21.5)}${ridge(35.7)}${ridge(41.8)}
  <!-- recess along the top edge -->
  <path d="M12 1.6V2.6H88V1.6" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".25"/>
  <!-- tape running along the bottom between the rollers -->
  <line x1="8.3" x2="91.7" y1="61.75" y2="61.75" stroke="#241a14" stroke-width=".5"/>
  <!-- raised block where the heads reach the tape -->
  <path d="M22 49H78L82 63H18Z" fill="#fff" fill-opacity=".13"/>
  <path d="M18 63L22 49H78L82 63" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width=".32"/>
  <path d="M18.5 63L22.4 49.5H77.6L81.5 63" fill="none" stroke="#3f474f" stroke-opacity=".28" stroke-width=".14"/>
  ${ring(33, 57, 2.2)}${ring(67, 57, 2.2)}${ring(50, 53.6, 1.5)}${ring(41.5, 58.6, 1.2)}${ring(58.5, 58.6, 1.2)}
  <rect x="44" y="59.9" width="12" height="1.5" rx=".3" fill="#fff" fill-opacity=".35" stroke="#78808a" stroke-opacity=".45" stroke-width=".12"/>
  <rect x="48.4" y="60.1" width="3.2" height="1.3" rx=".2" fill="#6b4a33"/>
  ${roller(11.5, 58.3)}${roller(88.5, 58.3)}
  <!-- reflections across the plastic -->
  <g filter="url(#blur)">
    <path d="M30 -2H44L20 65H6Z" fill="url(#streak)" opacity=".55"/>
    <path d="M62 -2H67L43 65H38Z" fill="url(#streak)" opacity=".7"/>
    <path d="M88 -2H97L73 65H64Z" fill="url(#streak)" opacity=".35"/>
  </g>
</g>
<rect x=".2" y=".2" width="99.6" height="62.6" rx="2.5" fill="none" stroke="#5d656e" stroke-opacity=".6" stroke-width=".3"/>
<rect x=".65" y=".65" width="98.7" height="61.7" rx="2.2" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width=".35"/>
<rect x="1.5" y="1.5" width="97" height="60" rx="1.6" fill="none" stroke="#5d656e" stroke-opacity=".35" stroke-width=".16"/>
<rect x="1.85" y="1.85" width="96.3" height="59.3" rx="1.4" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".22"/>

<!-- stick-on paper label for the handwriting -->
<g filter="url(#fibre)"><rect x="13" y="3.3" width="74" height="10.3" rx=".5" fill="url(#paper)"/></g>
<g stroke="#a39f93" stroke-width=".12"><line x1="22.5" x2="85" y1="8.7" y2="8.7"/><line x1="22.5" x2="85" y1="12.5" y2="12.5"/></g>
<circle cx="17.6" cy="8.4" r="2.3" fill="none" stroke="#2b2a27" stroke-width=".26"/>
<text x="17.6" y="9.65" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="3.4" font-weight="700" fill="#2b2a27">A</text>

${screw(3.4, 3.5, 20)}${screw(96.6, 3.5, 65)}${screw(3.4, 59.5, 8)}${screw(96.6, 59.5, 50)}
</svg>`;

const pockets = [...Array(8)].map((_, i) => `<g transform="rotate(${i * 45 + 12} 10 10)">
  <ellipse cx="10" cy="2.55" rx="1.45" ry=".95" fill="#aeb6bd" fill-opacity=".38"/>
  <ellipse cx="10" cy="2.55" rx="1.45" ry=".95" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width=".16"/>
  <path d="M8.7 2.9A1.45 .95 0 0 0 11.3 2.9" fill="none" stroke="#59616a" stroke-opacity=".35" stroke-width=".1"/></g>`).join('');
const teeth = [...Array(6)].map((_, i) => `<g transform="rotate(${i * 60} 10 10)">
  <path d="M9.45 5.05H10.55L10.4 6.5H9.6Z" fill="#fff" fill-opacity=".92" stroke="#59616a" stroke-opacity=".5" stroke-width=".1"/></g>`).join('');
const hub = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="480" height="480">
<defs><radialGradient id="flange" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".80"/><stop offset="1" stop-color="#e6eaee" stop-opacity=".62"/></radialGradient></defs>
<path fill-rule="evenodd" fill="url(#flange)" d="M10 .3A9.7 9.7 0 1 1 9.99 .3ZM10 5A5 5 0 1 0 10.01 5Z"/>
<circle cx="10" cy="10" r="9.7" fill="none" stroke="#59616a" stroke-opacity=".5" stroke-width=".16"/>
<circle cx="10" cy="10" r="9.25" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width=".2"/>
${pockets}
<circle cx="10" cy="10" r="5.75" fill="none" stroke="#59616a" stroke-opacity=".35" stroke-width=".14"/>
<circle cx="10" cy="10" r="5.35" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width=".5"/>
<circle cx="10" cy="10" r="5" fill="none" stroke="#59616a" stroke-opacity=".55" stroke-width=".14"/>
${teeth}
<path d="M2.6 6A8.4 8.4 0 0 1 7 2.2" fill="none" stroke="#fff" stroke-width=".3" stroke-linecap="round"/>
</svg>`;
document.body.innerHTML = layer === 'hub' ? hub : front;
</script></body></html>
